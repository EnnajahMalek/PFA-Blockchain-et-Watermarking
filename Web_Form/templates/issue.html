{% extends "base.html" %}
{% block title %}Émettre un Diplôme{% endblock %}
{% block content %}
<div class="bg-white p-8 rounded-lg shadow-md">
    <h1 class="text-3xl font-bold mb-6">Émettre un Nouveau Diplôme</h1>
    <form method="post" action="{{ url_for('issue') }}" enctype="multipart/form-data" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Nom Complet de l'Étudiant</label>
            <input type="text" name="student_name" required
                   class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">ID Étudiant (optionnel)</label>
            <input type="text" name="student_id"
                   class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Programme</label>
            <input type="text" name="program" value="Informatique"
                   class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500">
        </div>
        <button type="submit"
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded hover:bg-indigo-700 transition">
            Générer et Enregistrer sur la Blockchain
        </button>
    </form>
</div>
{% endblock %}
