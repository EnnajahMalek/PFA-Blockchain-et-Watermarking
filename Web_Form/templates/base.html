<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Système de Diplômes{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-xl font-bold text-indigo-700">DiplomaChain</a>
        <div class="space-x-4">
            <a href="/issue" class="text-indigo-600 hover:text-indigo-800">Émettre</a>
            <a href="/verify" class="text-indigo-600 hover:text-indigo-800">Vérifier</a>
        </div>
    </nav>
    <main class="p-8 max-w-4xl mx-auto">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-4 p-4 rounded {% if category == 'success' %}bg-green-100 text-green-800{% elif category == 'error' %}bg-red-100 text-red-800{% else %}bg-yellow-100 text-yellow-800{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
